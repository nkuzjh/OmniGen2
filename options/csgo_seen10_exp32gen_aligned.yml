name: csgo_seen10_exp32gen_aligned
experiment: csgo_seen10_exp32gen_aligned
seed: 42
device_specific_seed: true
workder_specific_seed: true

data:
  dataset_type: csgo_seen10
  data_root: /home/jiahao/task/UniLIP/data/csgo_benchmark_v2
  train_split: seen_train
  validation_split: seen_validation
  reference_image_size: 224
  target_image_size: 448
  image_size: 448
  use_chat_template: true
  maximum_text_tokens: 888
  prompt_dropout_prob: 0.0001
  ref_img_dropout_prob: 0.5
  max_input_pixels: 50176
  max_output_pixels: 200704
  max_side_length: 448

model:
  pretrained_vae_model_name_or_path: black-forest-labs/FLUX.1-dev
  pretrained_text_encoder_model_name_or_path: Qwen/Qwen2.5-VL-3B-Instruct
  pretrained_model_path: OmniGen2/OmniGen2
  pose_conditioning: false
  arch_opt:
    patch_size: 2
    in_channels: 16
    hidden_size: 2520
    num_layers: 32
    num_refiner_layers: 2
    num_attention_heads: 21
    num_kv_heads: 7
    multiple_of: 256
    norm_eps: 1.0e-5
    axes_dim_rope: [40, 40, 40]
    axes_lens: [10000, 10000, 10000]
    text_feat_dim: 2048
    timestep_scale: 1000
    pose_conditioning: false

transport:
  snr_type: lognorm
  do_shift: true
  dynamic_time_shift: true

train:
  # These are overridable defaults, NOT required individual batch values.
  # Only actual world_size * batch_size * gradient_accumulation_steps == 128.
  global_batch_size: 128
  batch_size: 1
  gradient_accumulation_steps: 128
  max_optimizer_steps: 19500
  max_train_steps: 19500
  checkpoint_steps: [4000, 8000, 12000, 16000, 19500]
  dataloader_num_workers: 0
  learning_rate: 8.0e-7
  scale_lr: false
  lr_scheduler: timm_constant_with_warmup
  warmup_t: 500
  warmup_lr_init: 1.0e-18
  warmup_prefix: true
  t_in_epochs: false
  use_8bit_adam: false
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_weight_decay: 0.01
  adam_epsilon: 1.0e-8
  max_grad_norm: 1.0
  gradient_checkpointing: true
  set_grads_to_none: true
  allow_tf32: false
  mixed_precision: bf16
  ema_decay: 0.0
  lora_ft: true
  lora_rank: 8
  lora_alpha: 8
  lora_dropout: 0.0

val:
  validation_steps: 4000
  max_validation_batches: null
  seed: 4242

logger:
  log_with: null
  checkpointing_steps: 4000
  checkpoints_total_limit: null

cache_dir: null
resume_from_checkpoint: null
